name: Deploy Cloudflare Pages
on:
  push:
    branches: [main]
    paths: ['cloudflare-pages/**', 'working/qa-site.py', 'working/test-contact.mjs', 'working/test-print-catalog.mjs', 'working/test-lumaprints.mjs', 'working/test-pages-bindings.mjs', 'working/stage-site.mjs', '.github/workflows/deploy-pages.yml']
  pull_request:
    paths: ['cloudflare-pages/**', 'working/qa-site.py', 'working/test-contact.mjs', 'working/test-print-catalog.mjs', 'working/test-lumaprints.mjs', 'working/test-pages-bindings.mjs', 'working/stage-site.mjs', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check pages, links, Final 33, and Events
        run: python working/qa-site.py cloudflare-pages
      - name: Check contact validation and failure handling without sending email
        run: node working/test-contact.mjs
      - name: Check the print catalog publishes only the confirmed price
        run: node working/test-print-catalog.mjs
      - name: Check LumaPrints auth, catalog, and quotes without placing orders
        run: node working/test-lumaprints.mjs
      - name: Check binding reports omit secret values
        run: node working/test-pages-bindings.mjs
      - name: Build deployable site only
        run: node working/stage-site.mjs
  deploy:
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require scoped deployment credentials before any upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN (Account Cloudflare Pages Edit).'; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = 'f3ee68d66369fd4b2bc390d1dae218f6' || { echo '::error::Missing or unexpected Cloudflare account ID.'; exit 1; }
      - run: node working/stage-site.mjs
      - name: Deploy isolated candidate; preserve current pages.dev alias
        id: candidate
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          workingDirectory: .site-build
          command: pages deploy public --project-name=bitter-buffalo-art --branch=qa-${{ github.sha }} --commit-hash=${{ github.sha }}
      - name: Verify every candidate page and public asset matches this commit
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.deployment-url }}
        run: |
          test -n "$CANDIDATE_URL"
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if python working/qa-site.py cloudflare-pages --base "$CANDIDATE_URL"; then
              ok=1
              break
            fi
            echo "Candidate not ready (attempt $attempt); waiting 15s"
            sleep 15
          done
          test "$ok" = 1
      - name: Publish verified site to Cloudflare Pages production branch (owner-approved)
        # Cloudflare Pages production branch is 'preview' for this project.
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          workingDirectory: .site-build
          command: pages deploy public --project-name=bitter-buffalo-art --branch=preview --commit-hash=${{ github.sha }}
      - name: Verify production alias after publication
        run: |
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if python working/qa-site.py cloudflare-pages --base https://bitter-buffalo-art.pages.dev; then
              ok=1
              break
            fi
            echo "Production Pages alias not ready (attempt $attempt); waiting 15s"
            sleep 15
          done
          test "$ok" = 1
  preview:
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Require scoped deployment credentials before any upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Missing CLOUDFLARE_API_TOKEN (Account Cloudflare Pages Edit).'; exit 1; }
          test "$CLOUDFLARE_ACCOUNT_ID" = 'f3ee68d66369fd4b2bc390d1dae218f6' || { echo '::error::Missing or unexpected Cloudflare account ID.'; exit 1; }
      - name: Refuse the live production branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            preview|main|"") echo "::error::Refusing to deploy ref '$HEAD_REF'. The Pages production branch is preview."; exit 1 ;;
          esac
          case "$HEAD_REF" in
            *[!A-Za-z0-9/_-]*) echo "::error::Refusing an unsafe branch name."; exit 1 ;;
          esac
      - run: node working/stage-site.mjs
      - name: Deploy this pull request to a non-production Pages branch
        id: candidate
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.1'
          workingDirectory: .site-build
          command: pages deploy public --project-name=bitter-buffalo-art --branch=${{ github.head_ref }} --commit-hash=${{ github.sha }}
      - name: Confirm the preview fails closed and matches this commit
        env:
          CANDIDATE_URL: ${{ steps.candidate.outputs.deployment-url }}
        run: |
          test -n "$CANDIDATE_URL"
          case "$CANDIDATE_URL" in
            *bitter-buffalo-art.pages.dev*) ;;
            *) echo "::error::Unexpected deployment host."; exit 1 ;;
          esac
          ok=0
          for attempt in 1 2 3 4 5 6; do
            if python working/qa-site.py cloudflare-pages --base "$CANDIDATE_URL"; then
              ok=1
              break
            fi
            echo "Preview not ready (attempt $attempt); waiting 15s"
            sleep 15
          done
          test "$ok" = 1
          code="$(curl -sS -o /tmp/lumaprints-status.json -w '%{http_code}' "$CANDIDATE_URL/api/lumaprints/status")"
          echo "status_http=$code"
          test "$code" = "401" -o "$code" = "503"
          python - <<'PY'
          import json
          body = json.load(open("/tmp/lumaprints-status.json"))
          text = json.dumps(body)
          for banned in ("Authorization", "Basic ", "LUMAPRINTS_API_KEY", "LUMAPRINTS_API_SECRET"):
              if banned in text:
                  raise SystemExit(f"status body contained {banned}")
          if body.get("authenticated") is not False:
              raise SystemExit("unauthenticated status did not fail closed")
          print("status_error_class=" + str(body.get("errorClass")))
          PY
